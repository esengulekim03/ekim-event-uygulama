<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ekim Event | Etkinlik Yönetim Sistemi</title>
<meta name="theme-color" content="#101827">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#6d7788;--line:#e5eaf1;--brand:#16c6c8;--brand2:#7c5cff;--danger:#e5484d;--shadow:0 12px 35px rgba(24,39,75,.08);--r:18px}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:flex}.sidebar{width:250px;background:#111827;color:#fff;position:fixed;inset:0 auto 0 0;padding:20px 14px;z-index:20}.logo{font-weight:900;font-size:22px;padding:8px 10px 20px}.logo span{color:#28d7d9}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#cbd5e1;text-align:left;padding:12px 13px;border-radius:12px}.nav button.active,.nav button:hover{background:#1f2937;color:#fff}.content{margin-left:250px;width:calc(100% - 250px);padding:24px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h1{margin:0;font-size:26px}.pill{padding:7px 11px;border-radius:999px;background:#e9fbfb;color:#008d8f;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}.stat{min-height:120px}.stat .n{font-size:30px;font-weight:900;margin:7px 0}.muted{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}.toolbar>*{height:42px}.input,.select,.textarea{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--brand)}.input{min-width:220px}.btn{background:#eef2f7;color:var(--ink);padding:10px 14px;border-radius:11px;font-weight:700}.btn.primary{background:linear-gradient(135deg,var(--brand),#0aa7d0);color:#fff}.btn.purple{background:linear-gradient(135deg,var(--brand2),#a24fff);color:#fff}.btn.danger{background:#fff0f0;color:var(--danger)}.btn.small{padding:7px 10px;font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:12px;color:var(--muted)}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#f0f3f8;font-size:11px;font-weight:800;margin:2px}.tag.green{background:#e8f8ef;color:#18834a}.tag.orange{background:#fff3dd;color:#a86400}.tag.red{background:#ffebec;color:#bd3035}.tag.blue{background:#eaf2ff;color:#356bd5}.empty{padding:35px;text-align:center;color:var(--muted)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dow{font-size:11px;color:var(--muted);font-weight:800;padding:6px}.day{min-height:105px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px;overflow:hidden}.day.other{opacity:.45}.daynum{font-size:12px;font-weight:800;margin-bottom:5px}.eventchip{font-size:10px;padding:4px 6px;border-radius:7px;color:#fff;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal-bg{position:fixed;inset:0;background:rgba(9,15,27,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modal{background:#fff;border-radius:20px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:20px}.modal h2{margin-top:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#586274}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.mobilebar{display:none}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 15px;border-radius:12px;z-index:100;box-shadow:var(--shadow)}.notice{padding:12px 14px;background:#fff8e7;border:1px solid #f4dc99;border-radius:12px;color:#765500;margin-bottom:15px;font-size:13px}.dangerbox{padding:12px 14px;background:#fff0f0;border:1px solid #ffd0d2;border-radius:12px;color:#a22b31;font-size:13px}.detail{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.list{display:grid;gap:9px}.listitem{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.actions-inline{display:flex;gap:6px;flex-wrap:wrap}.search-results{margin-bottom:15px}.mobile-only{display:none}@media(max-width:900px){.sidebar{display:none}.content{margin-left:0;width:100%;padding:15px;padding-bottom:90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111827;z-index:30;overflow:auto}.mobilebar button{min-width:72px;background:transparent;color:#cbd5e1;padding:10px 5px;font-size:10px}.mobilebar button.active{color:#27d5d7}.detail{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.day{min-height:80px}.eventchip{font-size:9px}.top h1{font-size:21px}.input{min-width:150px;width:100%}}@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.card{padding:13px}.calendar{gap:3px}.dow{font-size:9px}.day{min-height:72px;padding:4px}.daynum{font-size:10px}.eventchip{padding:2px 3px;font-size:8px}.hide-mobile{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { Client, Databases, ID, Query } from 'https://cdn.jsdelivr.net/npm/appwrite@18.0.0/+esm';

const CONFIG={endpoint:'https://fra.cloud.appwrite.io/v1',projectId:'6ac57b3f00273bc7e031',databaseId:'6ac57bf7000d6193bbb9',collectionId:'records'};
const client=new Client().setEndpoint(CONFIG.endpoint).setProject(CONFIG.projectId); const db=new Databases(client);
const nav=[['dashboard','🏠','Ana Sayfa'],['events','🎪','Etkinlikler'],['schools','🏫','Okullar'],['stock','📦','Stok'],['equipment','🛠️','Ekipman'],['staff','👥','Personel'],['finance','💰','Finans'],['reminders','🔔','Hatırlatmalar'],['reports','📊','Raporlar'],['trash','🗑️','Çöp Kutusu']];
let state={page:'dashboard',records:[],search:'',modal:null,toast:'',cal:new Date(),selectedDay:null};
const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const uid=()=>ID.unique(); const now=()=>new Date().toISOString();
function notify(x){state.toast=x;render();setTimeout(()=>{state.toast='';render()},2200)}
function dataOf(r){try{return JSON.parse(r.data||'{}')}catch{return {}}}
function active(type){return state.records.filter(r=>!r.deleted&&r.type===type).map(r=>({...dataOf(r),_id:r.$id,_updated:r.updatedAt}))}
function all(type){return state.records.filter(r=>r.type===type).map(r=>({...dataOf(r),_id:r.$id,deleted:r.deleted,_updated:r.updatedAt}))}
async function load(){
 try{const res=await db.listDocuments(CONFIG.databaseId,CONFIG.collectionId,[Query.limit(500)]);state.records=res.documents;render();}
 catch(e){console.error(e);root.innerHTML='<div style="padding:30px"><h2>Ekim Event açılamadı</h2><div class="dangerbox">Appwrite bağlantısı kurulamadı. Koleksiyon ID, alanlar ve izinleri kontrol edin.<br><small>'+esc(e.message)+'</small></div></div>';}
}
async function save(type,obj,id=null){if(!navigator.onLine){notify('İnternet bağlantısı yok');return}const payload={type,data:JSON.stringify(obj),deleted:false,updatedAt:now()};try{if(id) await db.updateDocument(CONFIG.databaseId,CONFIG.collectionId,id,payload);else await db.createDocument(CONFIG.databaseId,CONFIG.collectionId,uid(),payload);await load();notify('Kaydedildi');}catch(e){console.error(e);notify('Kaydedilemedi: '+e.message)}}
async function trash(id){try{await db.updateDocument(CONFIG.databaseId,CONFIG.collectionId,id,{deleted:true,updatedAt:now()});await load();notify('Çöp kutusuna taşındı')}catch(e){notify('İşlem başarısız')}}
async function restore(id){try{await db.updateDocument(CONFIG.databaseId,CONFIG.collectionId,id,{deleted:false,updatedAt:now()});await load();notify('Geri yüklendi')}catch(e){notify('İşlem başarısız')}}
async function destroy(id){if(!confirm('Kalıcı olarak silinsin mi?'))return;try{await db.deleteDocument(CONFIG.databaseId,CONFIG.collectionId,id);await load();notify('Kalıcı silindi')}catch(e){notify('Silinemedi')}}
function openModal(type,obj={},id=null){state.modal={type,obj:{...obj},id};render()}; function closeModal(){state.modal=null;render()}
function navHtml(){return nav.map(n=>`<button class="${state.page===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</button>`).join('')}
function shell(body){return `<aside class="sidebar"><div class="logo"><span>EKİM</span> EVENT</div><div class="nav">${navHtml()}</div><div style="position:absolute;bottom:18px;padding:10px;color:#64748b;font-size:11px">Bulut: Appwrite</div></aside><main class="content"><div class="top"><div><h1>${nav.find(x=>x[0]===state.page)?.[2]||'Ekim Event'}</h1><div class="muted">Ekim Event Etkinlik Yönetim Sistemi</div></div><div class="pill">☁️ Senkron</div></div>${body}</main><nav class="mobilebar">${nav.slice(0,7).map(n=>`<button class="${state.page===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]}<br>${n[2]}</button>`).join('')}</nav>${state.modal?modalHtml():''}${state.toast?`<div class="toast">${esc(state.toast)}</div>`:''}`}
function dashboard(){const ev=active('event'),sch=active('school'),fin=active('finance'),stock=active('stock');const today=new Date().toISOString().slice(0,10);const upcoming=ev.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);const income=fin.filter(x=>x.kind==='income').reduce((s,x)=>s+Number(x.amount||0),0),expense=fin.filter(x=>x.kind==='expense').reduce((s,x)=>s+Number(x.amount||0),0);const low=stock.filter(x=>Number(x.quantity||0)<=Number(x.minimum||0));return `<div class="grid"><div class="card stat"><div class="muted">Yaklaşan etkinlik</div><div class="n">${upcoming.length}</div></div><div class="card stat"><div class="muted">Toplam okul</div><div class="n">${sch.length}</div></div><div class="card stat"><div class="muted">Net sonuç</div><div class="n">₺${(income-expense).toLocaleString('tr-TR')}</div></div><div class="card stat"><div class="muted">Kritik stok</div><div class="n">${low.length}</div></div></div><div style="height:15px"></div><div class="grid" style="grid-template-columns:2fr 1fr"><div class="card"><div class="top"><h2 style="margin:0;font-size:18px">Yaklaşan etkinlikler</h2><button class="btn primary small" onclick="openModal('event')">+ Etkinlik</button></div>${upcoming.length?`<div class="list">${upcoming.map(e=>`<div class="listitem"><b>${esc(e.name)}</b><div class="muted">${esc(e.date)} ${esc(e.start||'')} · ${esc(e.school||e.customer||'')}</div></div>`).join('')}</div>`:'<div class="empty">Yaklaşan etkinlik yok.</div>'}</div><div class="card"><h2 style="margin-top:0;font-size:18px">Hızlı işlemler</h2><div class="list"><button class="btn" onclick="openModal('school')">🏫 Okul ekle</button><button class="btn" onclick="openModal('event')">🎪 Etkinlik ekle</button><button class="btn" onclick="openModal('stock')">📦 Stok ekle</button><button class="btn" onclick="openModal('finance')">💰 Gelir/gider</button></div></div></div>`}
function eventPage(){let items=active('event').filter(x=>!state.search||JSON.stringify(x).toLowerCase().includes(state.search.toLowerCase()));return `<div class="toolbar"><input class="input" placeholder="Etkinlik ara..." value="${esc(state.search)}" oninput="setSearch(this.value)"><button class="btn primary" onclick="openModal('event')">+ Yeni etkinlik</button><button class="btn" onclick="calendarPrev()">‹</button><button class="btn" onclick="calendarNext()">›</button><button class="btn" onclick="calendarToday()">Bugün</button></div>${calendarHtml()}<div style="height:15px"></div><div class="card"><div class="top"><h2 style="margin:0;font-size:18px">Etkinlik listesi</h2><span class="muted">${items.length} kayıt</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Etkinlik</th><th>Tarih</th><th>Okul/Müşteri</th><th>Durum</th><th></th></tr></thead><tbody>${items.map(e=>`<tr><td><b>${esc(e.name)}</b><br><span class="muted">${esc(e.address||'')}</span></td><td>${esc(e.date)}<br>${esc(e.start||'')}</td><td>${esc(e.school||e.customer||'-')}</td><td><span class="tag ${e.status==='completed'?'green':e.status==='cancelled'?'red':'blue'}">${esc(e.status||'pending')}</span></td><td><div class="actions-inline"><button class="btn small" onclick='editRecord("event","${e._id}")'>Düzenle</button><button class="btn small danger" onclick='trash("${e._id}")'>Sil</button></div></td></tr>`).join('')||`<tr><td colspan="5"><div class="empty">Henüz etkinlik yok.</div></td></tr>`}</tbody></table></div></div>`}
function calendarHtml(){const d=new Date(state.cal.getFullYear(),state.cal.getMonth(),1),last=new Date(state.cal.getFullYear(),state.cal.getMonth()+1,0);const start=(d.getDay()+6)%7;let cells=[];for(let i=0;i<start;i++){const x=new Date(d);x.setDate(i-start+1);cells.push(dayCell(x,true))}for(let i=1;i<=last.getDate();i++)cells.push(dayCell(new Date(d.getFullYear(),d.getMonth(),i),false));while(cells.length%7) {const x=new Date(last);x.setDate(last.getDate()+cells.length-(start+last.getDate())+1);cells.push(dayCell(x,true))}const title=d.toLocaleDateString('tr-TR',{month:'long',year:'numeric'});return `<div class="card"><div class="top"><h2 style="margin:0;font-size:18px;text-transform:capitalize">${title}</h2><div class="muted">Ay görünümü</div></div><div class="calendar">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells.join('')}</div></div>`}
function dayCell(x,other){const ds=x.toISOString().slice(0,10),ev=active('event').filter(e=>e.date===ds);return `<div class="day ${other?'other':''}" onclick="dayClick('${ds}')"><div class="daynum">${x.getDate()}</div>${ev.slice(0,4).map(e=>`<div class="eventchip" style="background:${esc(e.color||'#16a5aa')}">${esc(e.name)}</div>`).join('')}${ev.length>4?`<div class="muted">+${ev.length-4} daha</div>`:''}</div>`}
function listPage(type,title,fields,cols){let items=active(type).filter(x=>!state.search||JSON.stringify(x).toLowerCase().includes(state.search.toLowerCase()));return `<div class="toolbar"><input class="input" placeholder="Ara..." value="${esc(state.search)}" oninput="setSearch(this.value)"><button class="btn primary" onclick="openModal('${type}')">+ ${title} ekle</button></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}<th></th></tr></thead><tbody>${items.map(x=>`<tr>${cols.map(c=>`<td>${c[1](x)}</td>`).join('')}<td><div class="actions-inline"><button class="btn small" onclick='editRecord("${type}","${x._id}")'>Düzenle</button><button class="btn small danger" onclick='trash("${x._id}")'>Sil</button></div></td></tr>`).join('')||`<tr><td colspan="${cols.length+1}"><div class="empty">Kayıt yok.</div></td></tr>`}</tbody></table></div></div>`}
function schools(){return listPage('school','okul',[],[['Okul',x=>`<b>${esc(x.name)}</b>`],['Yetkili',x=>esc(x.contact||'-')],['Telefon',x=>esc(x.phone||'-')],['Durum',x=>`<span class="tag ${x.status==='positive'?'green':x.status==='negative'?'red':'orange'}">${esc(x.status||'pending')}</span>`]])}
function stock(){return listPage('stock','ürün',[],[['Ürün',x=>`<b>${esc(x.name)}</b><br><span class="muted">${esc(x.category||'')}</span>`],['Miktar',x=>`${x.quantity||0} ${esc(x.unit||'adet')}`],['Min.',x=>x.minimum||0],['Durum',x=>(Number(x.quantity||0)<=Number(x.minimum||0)?'<span class="tag red">Düşük</span>':'<span class="tag green">Normal</span>')]])}
function equipment(){return listPage('equipment','ekipman',[],[['Ekipman',x=>`<b>${esc(x.name)}</b>`],['Kategori',x=>esc(x.category||'-')],['Adet',x=>x.quantity||0],['Konum',x=>esc(x.location||'-')]])}
function staff(){return listPage('staff','personel',[],[['Ad Soyad',x=>`<b>${esc(x.name)}</b>`],['Rol',x=>esc(x.role||'-')],['Telefon',x=>esc(x.phone||'-')]])}
function finance(){return listPage('finance','kayıt',[],[['Tür',x=>`<span class="tag ${x.kind==='income'?'green':'red'}">${x.kind==='income'?'Gelir':'Gider'}</span>`],['Açıklama',x=>esc(x.description||'-')],['Tutar',x=>`₺${Number(x.amount||0).toLocaleString('tr-TR')}`],['Tarih',x=>esc(x.date||'')]])}
function reminders(){return listPage('reminder','hatırlatma',[],[['Başlık',x=>`<b>${esc(x.title)}</b>`],['Tarih',x=>esc(x.date||'')],['Not',x=>esc(x.note||'-')]])}
function reports(){const fin=active('finance'),income=fin.filter(x=>x.kind==='income').reduce((s,x)=>s+Number(x.amount||0),0),expense=fin.filter(x=>x.kind==='expense').reduce((s,x)=>s+Number(x.amount||0),0);const ev=active('event');return `<div class="grid"><div class="card stat"><div class="muted">Gelir</div><div class="n">₺${income.toLocaleString('tr-TR')}</div></div><div class="card stat"><div class="muted">Gider</div><div class="n">₺${expense.toLocaleString('tr-TR')}</div></div><div class="card stat"><div class="muted">Net</div><div class="n">₺${(income-expense).toLocaleString('tr-TR')}</div></div><div class="card stat"><div class="muted">Etkinlik</div><div class="n">${ev.length}</div></div></div><div style="height:15px"></div><div class="card"><h2>Rapor özeti</h2><p class="muted">Gelir, gider, net sonuç ve etkinlik sayıları Appwrite kayıtlarından hesaplanır. Aylık detay için finans tarihlerini kullanabilirsiniz.</p></div>`}
function trashPage(){const items=state.records.filter(r=>r.deleted);return `<div class="notice">Silinen kayıtlar burada tutulur. Geri yükleyebilir veya kalıcı olarak silebilirsiniz.</div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Tür</th><th>İçerik</th><th>Güncelleme</th><th></th></tr></thead><tbody>${items.map(r=>{const x=dataOf(r);return `<tr><td>${esc(r.type)}</td><td><b>${esc(x.name||x.title||x.description||'Kayıt')}</b></td><td>${esc(r.updatedAt||'')}</td><td><div class="actions-inline"><button class="btn small" onclick='restore("${r.$id}")'>Geri yükle</button><button class="btn small danger" onclick='destroy("${r.$id}")'>Kalıcı sil</button></div></td></tr>`}).join('')||`<tr><td colspan="4"><div class="empty">Çöp kutusu boş.</div></td></tr>`}</tbody></table></div></div>`}
function searchPage(){const q=state.search.trim().toLowerCase();if(!q)return `<div class="card"><div class="empty">Üst menüdeki arama alanını kullanabilirsiniz.</div></div>`;const out=state.records.filter(r=>!r.deleted&&JSON.stringify(r).toLowerCase().includes(q));return `<div class="card search-results"><b>Arama sonuçları: ${out.length}</b></div>`+out.map(r=>{const x=dataOf(r);return `<div class="card" style="margin-bottom:9px"><span class="tag">${esc(r.type)}</span><b>${esc(x.name||x.title||x.description||'Kayıt')}</b><div class="muted">${esc(JSON.stringify(x).slice(0,240))}</div></div>`}).join('')}
function modalHtml(){const m=state.modal,o=m.obj;let title='Kayıt';let fields=[];if(m.type==='event'){title='Etkinlik';fields=[['name','Etkinlik adı','text',true],['date','Tarih','date',true],['start','Başlangıç','time'],['end','Bitiş','time'],['school','Okul / müşteri','text'],['address','Adres','text'],['contact','Yetkili','text'],['phone','Telefon','tel'],['services','Hizmetler','text'],['personnel','Personel','text'],['equipment','Ekipman','text'],['status','Durum','select',false,['offer','confirmed','preparing','completed','cancelled']],['eventType','Etkinlik tipi','select',false,['free','paid','ticketed']],['ticketPrice','Bilet fiyatı','number'],['ticketCount','Bilet/katılım kapasitesi','number'],['soldTickets','Satılan bilet','number'],['fee','Etkinlik ücreti','number'],['deposit','Kapora','number'],['remaining','Kalan ödeme','number'],['invoiceStatus','Fatura durumu','text'],['invoiceNumber','Fatura no','text'],['color','Takvim rengi','color'],['notes','Notlar','textarea',false]]}
else if(m.type==='school'){title='Okul';fields=[['name','Okul adı','text',true],['contact','Yetkili','text'],['phone','Telefon','tel'],['email','E-posta','email'],['address','Adres','text'],['firstMeeting','İlk görüşme','date'],['lastMeeting','Son görüşme','date'],['status','Durum','select',false,['positive','negative','pending']],['services','Sunulan hizmetler','text'],['notes','Genel not','textarea',false]]}
else if(m.type==='stock'){title='Stok ürünü';fields=[['name','Ürün adı','text',true],['category','Kategori','text'],['quantity','Miktar','number'],['unit','Birim','text'],['minimum','Minimum stok','number'],['purchasePrice','Alış fiyatı','number'],['supplier','Tedarikçi','text'],['code','Kod','text'],['notes','Not','textarea',false]]}
else if(m.type==='equipment'){title='Ekipman';fields=[['name','Ekipman adı','text',true],['category','Kategori','text'],['quantity','Adet','number'],['status','Durum','text'],['location','Konum','text'],['maintenance','Bakım','text'],['notes','Not','textarea',false]]}
else if(m.type==='staff'){title='Personel';fields=[['name','Ad soyad','text',true],['role','Rol','text'],['phone','Telefon','tel'],['notes','Not','textarea',false]]}
else if(m.type==='finance'){title='Finans kaydı';fields=[['kind','Tür','select',true,['income','expense']],['description','Açıklama','text',true],['amount','Tutar','number',true],['date','Tarih','date',true],['event','İlgili etkinlik','text'],['category','Kategori','text'],['notes','Not','textarea',false]]}
else {title='Hatırlatma';fields=[['title','Başlık','text',true],['date','Tarih','date',true],['note','Not','textarea',false]]}
return `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2><div class="formgrid">${fields.map(f=>{const [key,label,type,req,opts]=f;let val=o[key]??'';if(type==='select')return `<div class="field"><label>${label}</label><select class="select" id="f_${key}">${opts.map(v=>`<option value="${v}" ${String(val)===v?'selected':''}>${v}</option>`).join('')}</select></div>`;if(type==='textarea')return `<div class="field full"><label>${label}</label><textarea class="textarea" rows="4" id="f_${key}">${esc(val)}</textarea></div>`;return `<div class="field ${key==='address'||key==='notes'||key==='services'?'full':''}"><label>${label}${req?' *':''}</label><input class="input" type="${type}" id="f_${key}" value="${esc(val)}"></div>`}).join('')}</div><div class="actions"><button class="btn" onclick="closeModal()">Vazgeç</button><button class="btn primary" onclick="submitModal()">Kaydet</button></div></div></div>`}
function currentBody(){switch(state.page){case'dashboard':return dashboard();case'events':return eventPage();case'schools':return schools();case'stock':return stock();case'equipment':return equipment();case'staff':return staff();case'finance':return finance();case'reminders':return reminders();case'reports':return reports();case'trash':return trashPage();default:return dashboard()}}
function render(){root.innerHTML=shell(currentBody())}
window.go=p=>{state.page=p;state.search='';render()};window.setSearch=v=>{state.search=v;render()};window.closeModal=closeModal;window.openModal=openModal;window.trash=trash;window.restore=restore;window.destroy=destroy;
window.editRecord=(type,id)=>{const r=state.records.find(x=>x.$id===id);if(r)openModal(type,dataOf(r),id)};
window.submitModal=async()=>{const m=state.modal,o={...m.obj};document.querySelectorAll('[id^="f_"]').forEach(el=>o[el.id.slice(2)]=el.value);if(!o.name&&!o.title&&!o.description&&m.type!=='finance'){notify('Lütfen zorunlu alanı doldurun');return}if(m.type==='finance'&&!o.description){notify('Açıklama gerekli');return}await save(m.type,o,m.id);state.modal=null;render()};
window.calendarPrev=()=>{state.cal=new Date(state.cal.getFullYear(),state.cal.getMonth()-1,1);render()};window.calendarNext=()=>{state.cal=new Date(state.cal.getFullYear(),state.cal.getMonth()+1,1);render()};window.calendarToday=()=>{state.cal=new Date();render()};window.dayClick=ds=>{state.search=ds;notify(ds+' tarihine bakılıyor');};
load();setInterval(load,30000);
</script>
</body></html>
